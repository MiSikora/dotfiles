start-at-login = true

# https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

accordion-padding = 24

[gaps]
    inner.horizontal = 8
    inner.vertical =   8
    outer.left =       0
    outer.bottom =     0
    outer.top =        0
    outer.right =      0

# https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]
    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right
    # All possible modifiers: cmd, alt, ctrl, shift
    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands
    
    # Change workspace
    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-cmd-shift-1 = "workspace 1"
    ctrl-alt-cmd-shift-2 = "workspace 2"
    ctrl-alt-cmd-shift-3 = "workspace 3"
    ctrl-alt-cmd-shift-4 = "workspace 4"
    ctrl-alt-cmd-shift-5 = "workspace 5"
    ctrl-alt-cmd-shift-6 = "workspace 6"
    ctrl-alt-cmd-shift-7 = "workspace 7"
    ctrl-alt-cmd-shift-8 = "workspace 8"
    ctrl-alt-cmd-shift-9 = "workspace 9"
    ctrl-alt-cmd-shift-0 = "workspace 0"
    ctrl-alt-cmd-shift-a = "workspace A"
    ctrl-alt-cmd-shift-c = "workspace C"
    ctrl-alt-cmd-shift-b = "workspace B"
    ctrl-alt-cmd-shift-e = "workspace E"
    ctrl-alt-cmd-shift-f = "workspace F"
    ctrl-alt-cmd-shift-i = "workspace I"
    ctrl-alt-cmd-shift-m = "workspace M"
    ctrl-alt-cmd-shift-s = "workspace S"
    ctrl-alt-cmd-shift-t = "workspace T"

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = "workspace-back-and-forth"

    # Change focused window
    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    ctrl-alt-cmd-shift-h = "focus --boundaries-action wrap-around-the-workspace left"
    ctrl-alt-cmd-shift-j = "focus --boundaries-action wrap-around-the-workspace down"
    ctrl-alt-cmd-shift-k = "focus --boundaries-action wrap-around-the-workspace up"
    ctrl-alt-cmd-shift-l = "focus --boundaries-action wrap-around-the-workspace right"

    # Move window to workspace
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    ctrl-alt-cmd-1 = "move-node-to-workspace 1"
    ctrl-alt-cmd-2 = "move-node-to-workspace 2"
    ctrl-alt-cmd-3 = "move-node-to-workspace 3"
    ctrl-alt-cmd-4 = "move-node-to-workspace 4"
    ctrl-alt-cmd-5 = "move-node-to-workspace 5"
    ctrl-alt-cmd-6 = "move-node-to-workspace 6"
    ctrl-alt-cmd-7 = "move-node-to-workspace 7"
    ctrl-alt-cmd-8 = "move-node-to-workspace 8"
    ctrl-alt-cmd-9 = "move-node-to-workspace 9"
    ctrl-alt-cmd-0 = "move-node-to-workspace 0"
    ctrl-alt-cmd-a = "move-node-to-workspace A"
    ctrl-alt-cmd-c = "move-node-to-workspace C"
    ctrl-alt-cmd-b = "move-node-to-workspace B"
    ctrl-alt-cmd-e = "move-node-to-workspace E"
    ctrl-alt-cmd-f = "move-node-to-workspace F"
    ctrl-alt-cmd-i = "move-node-to-workspace I"
    ctrl-alt-cmd-m = "move-node-to-workspace M"
    ctrl-alt-cmd-s = "move-node-to-workspace S"
    ctrl-alt-cmd-t = "move-node-to-workspace T"

    # Change window position
    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    ctrl-alt-cmd-h = "move left"
    ctrl-alt-cmd-j = "move down"
    ctrl-alt-cmd-k = "move up"
    ctrl-alt-cmd-l = "move right"

    # Change layout style
    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    ctrl-alt-cmd-slash = "layout tiles horizontal vertical"
    ctrl-alt-cmd-comma = "layout accordion horizontal vertical"

    # Resize container
    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    ctrl-alt-cmd-minus = "resize smart -50"
    ctrl-alt-cmd-equal = "resize smart +50"

    # Enter service mode
    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    ctrl-alt-cmd-shift-semicolon = "mode service"

# "service" binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ["reload-config", "mode main"]
    # reset layout
    r = ["flatten-workspace-tree", "mode main"]
    # Toggle between floating and tiling layout
    f = ["layout floating tiling", "mode main"]
    # Toggle fullscreen for a focused window
    m = ["fullscreen --no-outer-gaps", "mode main"]

    ctrl-alt-cmd-shift-h = ["join-with left", "mode main"]
    ctrl-alt-cmd-shift-j = ["join-with down", "mode main"]
    ctrl-alt-cmd-shift-k = ["join-with up", "mode main"]
    ctrl-alt-cmd-shift-l = ["join-with right", "mode main"]

# Terminal

[[on-window-detected]]
    if.app-id = "com.mitchellh.ghostty"
    run = ["move-node-to-workspace 0"]

# [A]udio

[[on-window-detected]]
    if.app-id = "com.spotify.client"
    run = ["move-node-to-workspace A"]

[[on-window-detected]]
    if.app-id = "com.electron.pocket-casts"
    run = ["move-node-to-workspace A"]

# [B]rowser

[[on-window-detected]]
    if.app-id = "org.mozilla.firefox"
    run = ["move-node-to-workspace B"]

# [C]alendar
[[on-window-detected]]
    if.app-id = "com.apple.iCal"
    run = ["move-node-to-workspace C"]

# [I]DE

[[on-window-detected]]
    if.app-id = "com.google.android.studio"
    run = ["move-node-to-workspace I"]

[[on-window-detected]]
    if.app-id = "com.jeetbrains.intellij.ce"
    run = ["move-node-to-workspace I"]

# [M]essaging

[[on-window-detected]]
    if.app-id = "com.facebook.archon.developerID"
    run = ["move-node-to-workspace M"]

[[on-window-detected]]
    if.app-id = "net.whatsapp.WhatsApp"
    run = ["move-node-to-workspace M"]

[[on-window-detected]]
    if.app-id = "com.apple.MobileSMS"
    run = ["move-node-to-workspace M"]

# [E]mail

[[on-window-detected]]
    if.app-id = "com.apple.mail"
    run = ["move-node-to-workspace E"]

# [F]igma

[[on-window-detected]]
    if.app-id = "com.figma.Desktop"
    run = ["move-node-to-workspace F"]

# [S]lack
[[on-window-detected]]
    if.app-id = "com.tinyspeck.slackmacgap"
    run = ["move-node-to-workspace S"]

# [T]asks
[[on-window-detected]]
    if.app-id = "com.linear"
    run = ["move-node-to-workspace T"]

# Floating windows

[[on-window-detected]]
    if.app-id = "cc.ffitch.shottr"
    run = "layout floating"

[[on-window-detected]]
    if.app-id = "org.pqrs.Karabiner-Elements.Settings"
    run = "layout floating"

[[on-window-detected]]
    if.app-id = "com.1password.1password"
    run = "layout floating"

